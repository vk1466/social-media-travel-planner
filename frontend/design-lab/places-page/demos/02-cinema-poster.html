.cp-hero {

.cp-tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: #ff5533; }

    window.addEventListener("keydown", (event) => {
      if (event.defaultPrevented) return;
      const tag = (event.target && event.target.tagName) || "";
