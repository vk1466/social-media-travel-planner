<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#132019" />
    <title>Food Detail Lab — 10 recipe-detail directions</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./shared/food-detail.css" />
  </head>
  <body>
    <header class="lab-header">
      <a href="../index.html" class="back-link">← Design Lab</a>
      <div class="lab-heading">
        <div>
          <p class="eyebrow">Food detail review · 10 alternatives</p>
          <h1>From saved reel to <em>ready to cook.</em></h1>
        </div>
        <p class="intro">Ten ways to turn extracted recipe data into a useful cooking surface. Switch recipes to pressure-test every direction with different content density.</p>
      </div>
    </header>

    <main class="lab-shell">
      <aside class="option-panel" aria-label="Detail directions">
        <div class="option-panel__top"><span>Directions</span><span id="option-count">01 / 10</span></div>
        <div id="option-list" class="option-list" role="tablist" aria-orientation="vertical"></div>
      </aside>

      <section class="preview-panel" aria-labelledby="preview-title">
        <div class="preview-toolbar">
          <div>
            <p id="preview-kicker" class="preview-kicker"></p>
            <h2 id="preview-title"></h2>
            <p id="preview-rationale" class="preview-rationale"></p>
          </div>
          <div class="recipe-switcher" aria-label="Preview recipe">
            <button type="button" class="recipe-dot is-active" data-recipe="0" aria-label="Preview noodles"></button>
            <button type="button" class="recipe-dot" data-recipe="1" aria-label="Preview shakshuka"></button>
            <button type="button" class="recipe-dot" data-recipe="2" aria-label="Preview lemon tart"></button>
          </div>
        </div>
        <div id="preview-stage" class="preview-stage" aria-live="polite"></div>
        <div class="preview-footer">
          <p id="preview-best-for"></p>
          <div class="arrow-controls">
            <button id="previous-option" type="button" aria-label="Previous direction">←</button>
            <span>Use arrow keys</span>
            <button id="next-option" type="button" aria-label="Next direction">→</button>
          </div>
        </div>
      </section>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="./shared/food-detail.js"></script>
  </body>
</html>
