<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20 Palette Directions · Wanderfile Design Lab</title><link rel="stylesheet" href="shared.css"></head><body class="index"><header class="index-head"><a href="../">← Design lab</a><p class="eyebrow">Wanderfile · Color study</p><h1>Twenty ways to frame a journey.</h1><p>Open a full-screen direction to compare its page ground, card surface, typography, controls, and travel imagery. Photos remain unchanged in every concept so the palette is the variable.</p></header><main id="gallery" class="gallery" aria-label="20 palette directions"></main><script src="data.js"></script><script>gallery.innerHTML=themes.map((t,i)=>`<a class="index-card" href="demos/${String(i+1).padStart(2,'0')}-${t[0].toLowerCase().replaceAll(' ','-')}.html" style="--bg:${t[1]};--card:${t[2]};--text:${t[3]};--muted:${t[4]};--accent:${t[5]};--border:${t[6]}"><span>${String(i+1).padStart(2,'0')} · ${+t[1].slice(1,3)<80?'Dark':'Light'}</span><h2>${t[0]}</h2><div class="mini"><b>Wanderfile</b><i style="background-image:url('../travel-card-modal/assets/amalfi-coast.png')"></i><i style="background-image:url('../travel-card-modal/assets/dolomites-lake.png')"></i></div><small>Open full-screen concept →</small></a>`).join('')</script></body></html>
