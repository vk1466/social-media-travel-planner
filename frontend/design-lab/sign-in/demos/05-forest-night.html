<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>05 · Forest night — Sign-in Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/gate.css" />
    <style>
      body {
        background: var(--wf-forest-deep);
        color: var(--wf-on-brand);
      }

      .night {
        position: relative;
        overflow: hidden;
      }

      /* Low horizon glow behind the panel, plus a faint mint grid. */
      .night::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(70% 50% at 50% 100%, rgb(41 180 133 / 0.28), transparent 68%),
          radial-gradient(40% 34% at 50% 8%, rgb(162 240 208 / 0.1), transparent 70%);
      }

      .night::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgb(162 240 208 / 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(162 240 208 / 0.05) 1px, transparent 1px);
        background-size: 72px 72px;
        mask-image: radial-gradient(70% 60% at 50% 45%, #000, transparent 78%);
      }

      .panel {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 440px;
        padding: 44px 40px 36px;
        border-radius: 26px;
        border: 1px solid rgb(162 240 208 / 0.22);
        background: rgb(255 255 255 / 0.05);
        backdrop-filter: blur(16px);
        box-shadow: 0 28px 64px rgb(0 0 0 / 0.45);
        text-align: center;
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      .panel .gate-title {
        color: var(--wf-on-brand);
        font-size: clamp(2.3rem, 5vw, 3.1rem);
      }

      .panel .gate-sub {
        color: var(--wf-on-dark);
        max-width: 29ch;
      }

      .panel .gate-actions {
        justify-content: center;
        margin-top: 6px;
      }

      .panel .btn-primary {
        min-width: 122px;
        background: var(--wf-mint);
        color: #0b241d;
        box-shadow: 0 8px 24px rgb(162 240 208 / 0.24);
      }

      .panel .btn-primary:hover {
        background: #b9f6de;
      }

      .panel .btn-secondary {
        min-width: 122px;
        background: transparent;
        border-color: rgb(162 240 208 / 0.3);
        color: var(--wf-on-dark);
      }

      .panel .btn-secondary:hover {
        background: rgb(255 255 255 / 0.08);
        border-color: var(--wf-mint);
        color: #fff;
      }

      .panel .gate-mark {
        background: rgb(162 240 208 / 0.14);
        border: 1px solid rgb(162 240 208 / 0.3);
        color: var(--wf-mint);
        box-shadow: none;
      }
    </style>
  </head>
  <body>
    <div class="gate-stage night">
      <main class="panel">
        <span class="gate-mark" aria-hidden="true">W</span>
        <h1 class="gate-title">Wanderfile</h1>
        <p class="gate-sub">Sign in to save posts, places, and trips to your library.</p>
        <div class="gate-actions">
          <button type="button" class="btn btn-primary">Sign in</button>
          <button type="button" class="btn btn-secondary">Sign up</button>
        </div>
      </main>
    </div>
    <script type="module" src="../shared/lab-bar.js"></script>
  </body>
</html>
