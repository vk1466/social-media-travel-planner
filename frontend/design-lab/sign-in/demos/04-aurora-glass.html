<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>04 · Aurora glass — Sign-in Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/gate.css" />
    <style>
      body {
        background: #eef7f3;
      }

      /* Mesh built from four radial stops in the Aurora Mint ramp. */
      .aurora {
        position: relative;
        overflow: hidden;
        background:
          radial-gradient(48% 46% at 14% 18%, rgb(162 240 208 / 0.85), transparent 62%),
          radial-gradient(42% 44% at 86% 12%, rgb(63 199 154 / 0.55), transparent 64%),
          radial-gradient(52% 50% at 76% 88%, rgb(31 156 114 / 0.42), transparent 66%),
          radial-gradient(40% 40% at 22% 88%, rgb(196 168 130 / 0.32), transparent 64%),
          linear-gradient(160deg, #f5faf8, #e6f3ee);
      }

      .glass {
        position: relative;
        width: 100%;
        max-width: 440px;
        padding: 44px 40px 38px;
        border-radius: 28px;
        border: 1px solid rgb(255 255 255 / 0.7);
        background: rgb(255 255 255 / 0.58);
        backdrop-filter: blur(22px) saturate(1.1);
        box-shadow:
          0 24px 60px rgb(11 36 29 / 0.12),
          inset 0 1px 0 rgb(255 255 255 / 0.9);
        text-align: center;
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      .glass .gate-title {
        font-size: clamp(2.3rem, 5vw, 3.1rem);
      }

      .glass .gate-sub {
        max-width: 29ch;
        color: #45514c;
      }

      .glass .gate-actions {
        justify-content: center;
        margin-top: 6px;
      }

      .glass .btn-primary {
        min-width: 122px;
      }

      .glass .btn-secondary {
        min-width: 122px;
        background: rgb(255 255 255 / 0.7);
        border-color: rgb(28 38 35 / 0.12);
      }

      .glass .gate-mark {
        border-radius: 50%;
        box-shadow: 0 8px 20px rgb(31 156 114 / 0.35);
      }
    </style>
  </head>
  <body>
    <div class="gate-stage aurora">
      <main class="glass">
        <span class="gate-mark" aria-hidden="true">W</span>
        <h1 class="gate-title">Wanderfile</h1>
        <p class="gate-sub">Sign in to save posts, places, and trips to your library.</p>
        <div class="gate-actions">
          <button type="button" class="btn btn-primary">Sign in</button>
          <button type="button" class="btn btn-secondary">Sign up</button>
        </div>
      </main>
    </div>
    <script type="module" src="../shared/lab-bar.js"></script>
  </body>
</html>
