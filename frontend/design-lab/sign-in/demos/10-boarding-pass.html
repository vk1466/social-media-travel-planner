<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>10 · Boarding pass — Sign-in Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../shared/gate.css" />
    <style>
      body {
        background: #e9eeeb;
      }

      .ticket {
        position: relative;
        width: 100%;
        max-width: 620px;
        display: grid;
        grid-template-columns: 86px minmax(0, 1fr);
        border-radius: 18px;
        background: var(--wf-surface);
        box-shadow: 0 24px 56px rgb(28 38 35 / 0.16);
        overflow: hidden;
      }

      .stub {
        display: grid;
        place-items: center;
        background: linear-gradient(180deg, var(--wf-forest), var(--wf-forest-deep));
        color: var(--wf-on-brand);
      }

      .stub span {
        writing-mode: vertical-rl;
        transform: rotate(180deg);
        font-family: var(--wf-font-serif);
        font-size: 1.15rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      /* Tear line: dotted rule plus the two notches punched out of it. */
      .ticket::before,
      .ticket::after {
        content: "";
        position: absolute;
        left: 86px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #e9eeeb;
        transform: translateX(-50%);
      }

      .ticket::before {
        top: -10px;
      }

      .ticket::after {
        bottom: -10px;
      }

      .body {
        position: relative;
        padding: 34px 34px 28px;
        display: grid;
        gap: 16px;
      }

      .body::before {
        content: "";
        position: absolute;
        left: 0;
        top: 14px;
        bottom: 14px;
        border-left: 2px dotted rgb(28 38 35 / 0.18);
      }

      .route {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: var(--wf-font-serif);
        font-size: 1.5rem;
        letter-spacing: 0.04em;
      }

      .route i {
        flex: 1;
        height: 1px;
        background: repeating-linear-gradient(
          to right,
          rgb(28 38 35 / 0.22) 0 4px,
          transparent 4px 8px
        );
      }

      .route svg {
        color: var(--wf-forest);
      }

      .ticket .gate-title {
        font-size: clamp(2rem, 4.6vw, 2.6rem);
      }

      .ticket .gate-sub {
        max-width: 34ch;
      }

      .rows {
        display: flex;
        flex-wrap: wrap;
        gap: 18px 30px;
        padding-top: 4px;
        border-top: 1px solid var(--wf-border-subtle);
      }

      .rows div {
        display: grid;
        gap: 3px;
      }

      .rows dt {
        margin: 0;
        font-size: 0.62rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--wf-quiet);
      }

      .rows dd {
        margin: 0;
        font-size: 0.9rem;
        font-weight: 600;
      }

      @media (max-width: 620px) {
        .ticket {
          grid-template-columns: 1fr;
        }

        .stub {
          padding: 12px 0;
        }

        .stub span {
          writing-mode: horizontal-tb;
          transform: none;
          font-size: 1rem;
        }

        .ticket::before,
        .ticket::after {
          display: none;
        }

        .body::before {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="gate-stage">
      <main class="ticket">
        <div class="stub" aria-hidden="true"><span>Wanderfile</span></div>
        <div class="body">
          <div class="route" aria-hidden="true">
            <span>SAVED</span>
            <i></i>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
              <path d="M21 15.5v1.8l-8-2.4v5.3l-2 1.3-2-1.3v-5.3l-8 2.4v-1.8l8-5V4.3A1.8 1.8 0 0 1 11 2.5a1.8 1.8 0 0 1 2 1.8v6.2Z" />
            </svg>
            <i></i>
            <span>THERE</span>
          </div>
          <h1 class="gate-title">Wanderfile</h1>
          <p class="gate-sub">Sign in to save posts, places, and trips to your library.</p>
          <div class="gate-actions">
            <button type="button" class="btn btn-primary">Sign in</button>
            <button type="button" class="btn btn-secondary">Sign up</button>
          </div>
          <dl class="rows">
            <div>
              <dt>Sources</dt>
              <dd>IG · TikTok · YT</dd>
            </div>
            <div>
              <dt>Library</dt>
              <dd>Posts &amp; places</dd>
            </div>
            <div>
              <dt>Boarding</dt>
              <dd>Anytime</dd>
            </div>
          </dl>
        </div>
      </main>
    </div>
    <script type="module" src="../shared/lab-bar.js"></script>
  </body>
</html>
