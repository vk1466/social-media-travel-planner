<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8f8ed" />
    <title>Wanderfile</title>
    <style>
      body { margin: 0; background: #f8f8ed; }
      @media (prefers-color-scheme: dark) { body { background: #14161a; } }
      .wf-boot-skeleton { padding: 20px; max-width: 1200px; margin: 0 auto; }
      .wf-boot-bar { height: 40px; border-radius: 999px; background: rgba(128,128,128,.15); margin-bottom: 20px; }
      .wf-boot-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
      .wf-boot-card { aspect-ratio: 3 / 4; border-radius: 16px; background: rgba(128,128,128,.15); animation: wf-boot-pulse 1.3s ease-in-out infinite; }
      @keyframes wf-boot-pulse { 0%,100% { opacity: .5 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="wf-boot-skeleton" aria-busy="true">
        <div class="wf-boot-bar"></div>
        <div class="wf-boot-grid">
          <div class="wf-boot-card"></div><div class="wf-boot-card"></div><div class="wf-boot-card"></div>
          <div class="wf-boot-card"></div><div class="wf-boot-card"></div><div class="wf-boot-card"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
