name: deploy-production

on:
  push:
    branches:
      - production

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  CDK_DEFAULT_REGION: us-west-2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install CDK CLI
        run: npm install -g aws-cdk
      - name: Install CDK Python deps
        working-directory: infra
        run: pip install -r requirements.txt
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy prod stack
        working-directory: infra
        env:
          CORS_ORIGINS: ${{ vars.CORS_ORIGINS }}
          CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
          ADMIN_USER_IDS: ${{ vars.ADMIN_USER_IDS }}
          MINDCASE_API_KEY: ${{ secrets.MINDCASE_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: cdk deploy TravelPlanner-prod --require-approval never

  # Vercel production deploys from the `production` Git branch via project settings.
  # Optionally set Vercel Git integration: Production Branch = production,
  # Root Directory = frontend, env VITE_API_BASE_URL + VITE_CLERK_PUBLISHABLE_KEY.
